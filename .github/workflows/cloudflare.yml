name: Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/logo.svg'
      - 'tools/crash-relay/**'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production

jobs:
  deploy:
    if: github.repository == 'remotesojourner/frameplayerx' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-production
      url: https://frameplayerx.org.uk/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node tools/crash-relay/build-site.mjs
      - name: Deploy the website and crash relay
        run: npx --yes wrangler@4.161.0 deploy --config tools/crash-relay/wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
