name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Run from the Actions tab: on main it publishes a stable release, on any
  # other branch a beta (a GitHub pre-release); with Alpha ticked, on any
  # branch, an alpha left as a draft. The version is calculated either way.
  workflow_dispatch:
    inputs:
      alpha:
        description: Alpha (a draft release to test before a beta; never offered as an update)
        type: boolean
        default: false

# Read-only for every job but the release, which publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Nothing to reuse between runs, and it keeps the cache small.
  CARGO_INCREMENTAL: 0

# Only GitHub's own Actions: Rust comes from rust-toolchain.toml and the
# build and release tools from tools/requirements.txt, which Dependabot
# keeps current (.github/dependabot.yml).

jobs:
  # main: the next stable version, which git-cliff calculates from the
  # conventional commits since the last stable tag (see cliff.toml). Other
  # branches and pull requests: that version as a beta, X.Y.Z-beta.N, with
  # N one above the highest existing beta of X.Y.Z. An alpha (any branch):
  # X.Y.Z-alpha.N with N the run number, as its draft has no tag to count;
  # a re-run keeps it and replaces its own draft. A pushed v* tag is used
  # as it is.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      is_release: ${{ steps.calc.outputs.is_release }}
      draft: ${{ steps.calc.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet "$(grep '^git-cliff==' tools/requirements.txt)"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Calculate version
        id: calc
        env:
          ALPHA: ${{ github.event_name == 'workflow_dispatch' && inputs.alpha }}
        run: |
          is_release=false
          draft=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            is_release=true
          else
            ver=$(git cliff --bumped-version)
            ver="${ver#v}"
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$ALPHA" != true ]; then
              # git-cliff repeats the last version when nothing came since.
              if git rev-parse -q --verify "refs/tags/v$ver" > /dev/null; then
                echo "::warning::v$ver already exists and nothing was committed since: no release"
              else
                is_release=true
              fi
            else
              # A beta or alpha must sort above every stable release, also
              # when the branch has nothing new or was cut before the latest.
              latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
              latest="${latest#v}"
              if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$ver" | sort -V | head -1)" = "$ver" ]; then
                IFS=. read -r major minor patch <<< "$latest"
                ver="$major.$minor.$((patch + 1))"
              fi
              if [ "$ALPHA" = true ]; then
                ver="$ver-alpha.$GITHUB_RUN_NUMBER"
                draft=true
              else
                n=$(git tag -l "v$ver-beta.*" | sed -n "s/^v$ver-beta\.\([0-9]\+\)$/\1/p" | sort -n | tail -1)
                ver="$ver-beta.$((${n:-0} + 1))"
              fi
              if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                is_release=true
              fi
            fi
          fi
          case "$ver" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "Version $ver, pre-release: $prerelease, release: $is_release, draft: $draft"
          {
            echo "version=$ver"
            echo "tag=v$ver"
            echo "prerelease=$prerelease"
            echo "is_release=$is_release"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"

  check:
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          sed -i 's/^version = .*/version = "${{ needs.version.outputs.version }}"/' crates/frameplayerx/Cargo.toml
      - name: Install Rust
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # A new Rust starts afresh; new crates build on the last cache.
          key: cargo-check-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-check-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config mesa-vulkan-drivers zip shellcheck
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet -r tools/requirements.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Shell scripts
        run: |
          for s in packaging/*.sh tools/*.sh; do
            bash -n "$s"
          done
          shellcheck packaging/*.sh tools/*.sh
      # A new zig or meson builds it again.
      - name: Restore FFmpeg builds
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/build-ffmpeg.sh', 'tools/requirements.txt') }}
      - name: Build FFmpeg (x86_64 for tests, aarch64 for the Frame)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh x86_64 aarch64
      # Saved right away, so a later failing step does not throw it away.
      - name: Save FFmpeg builds
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/build-ffmpeg.sh', 'tools/requirements.txt') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Both modes: one catches public docs linking private items, the other
      # broken links in private items' docs.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps
          cargo doc --workspace --no-deps --document-private-items
      - name: Tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ffmpeg/x86_64/lib
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: cargo test --workspace
      - name: Desktop Mode installer tests
        working-directory: tools/frame-desktop-install
        run: python3 -m unittest
      # Every screen as a flat PNG, for design review (artifact ui-preview).
      - name: UI preview
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ffmpeg/x86_64/lib
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: tools/ui-preview.sh ui-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview
          path: ui-preview/
      - name: Package for the Steam Frame (aarch64, glibc 2.28)
        run: tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frameplayerx-aarch64
          path: dist/

  # The PC-side installer, for each desktop OS.
  installer:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: frameplayerx-install-linux-x86_64
            exe: frameplayerx-install
          - os: windows-latest
            name: frameplayerx-install-windows-x86_64
            exe: frameplayerx-install.exe
          - os: macos-latest
            name: frameplayerx-install-macos-arm64
            exe: frameplayerx-install
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-installer-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-installer-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - run: cargo test -p frameplayerx-install
      - run: cargo build --release -p frameplayerx-install
      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          cp "target/release/${{ matrix.exe }}" "out/${{ matrix.name }}${{ endsWith(matrix.exe, '.exe') && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/

  release:
    if: needs.version.outputs.is_release == 'true'
    needs: [version, check, installer]
    runs-on: ubuntu-24.04
    # One at a time, so two runs can't publish the same version.
    concurrency: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      DRAFT: ${{ needs.version.outputs.draft }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frameplayerx-aarch64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: frameplayerx-install-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0
      - name: Check the tag is free
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Another run may have published this version since it was
          # calculated; a re-run of this one finds it on this commit.
          at=$(git -C src ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG already exists on $at; run the workflow again for the next version"
            exit 1
          fi
      - name: Install git-cliff
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet "$(grep '^git-cliff==' src/tools/requirements.txt)"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Generate release notes
        run: |
          cd src
          git cliff --bump --unreleased --strip header --output ../dist/RELEASE_NOTES.md || true
          if [ ! -s ../dist/RELEASE_NOTES.md ]; then
            echo "Release $TAG" > ../dist/RELEASE_NOTES.md
          fi
          if [ "$DRAFT" = true ]; then
            {
              echo "Alpha built from \`$GITHUB_REF_NAME\` (${GITHUB_SHA::7}), left as a draft for testing: FramePlayerX never offers a draft as an update, so install its zip by hand. Run the workflow again without Alpha to release it as a beta. Changes since the last stable release:"
              echo
              cat ../dist/RELEASE_NOTES.md
            } > ../dist/notes.md
            mv ../dist/notes.md ../dist/RELEASE_NOTES.md
          elif [ "$PRERELEASE" = true ]; then
            {
              echo "Beta built from \`$GITHUB_REF_NAME\` (${GITHUB_SHA::7}). FramePlayerX offers it on the Beta channel only (Settings › Updates). Changes since the last stable release:"
              echo
              cat ../dist/RELEASE_NOTES.md
            } > ../dist/notes.md
            mv ../dist/notes.md ../dist/RELEASE_NOTES.md
          fi
      - name: Sign the update manifest
        working-directory: src
        env:
          FP_RELEASE_KEY: ${{ secrets.FP_RELEASE_KEY }}
        run: |
          if [ -z "$FP_RELEASE_KEY" ]; then
            echo "::error::FP_RELEASE_KEY secret not set; an unsigned manifest.json would be refused by in-app updates"
            exit 1
          fi
          rustup toolchain install
          # Built first, so the key is on disk only while it signs.
          cargo build --release -p fp-updater --bin fp-release
          umask 077
          printf '%s\n' "$FP_RELEASE_KEY" > "$RUNNER_TEMP/release.key"
          target/release/fp-release sign ../dist/manifest.json --key "$RUNNER_TEMP/release.key"
          rm -f "$RUNNER_TEMP/release.key"
          # The signature must match the key FramePlayerX builds carry.
          target/release/fp-release verify ../dist/manifest.json
      # A draft until every file is in and reads back as built, so update
      # checks never find a release with files missing.
      - name: Publish the release
        run: |
          files=(dist/frameplayerx-*.zip dist/manifest.json dist/manifest.json.sig
            dist/framedrop.json dist/frameplayerx.json dist/frameplayerx-install-*
            src/tools/frame-desktop-install/frameplayerx-desktop-install.py
            src/tools/frame-desktop-install/Install-FramePlayerX.desktop
            src/tools/frame-desktop-install/Uninstall-FramePlayerX.desktop)
          # A re-run finds it published, or a failed run's draft to replace.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = false ]; then
              echo "$TAG is already published"
              exit 0
            fi
            gh release delete "$TAG" --yes
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${files[@]}" --draft --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file dist/RELEASE_NOTES.md "${flags[@]}"
          gh release download "$TAG" --dir "$RUNNER_TEMP/uploaded"
          for f in "${files[@]}"; do
            if ! cmp -s "$f" "$RUNNER_TEMP/uploaded/${f##*/}"; then
              echo "::error::${f##*/} on the draft differs from the one built"
              exit 1
            fi
          done
          # An alpha stays a draft: only people who can push to the
          # repository see it, and update checks skip drafts.
          if [ "$DRAFT" = true ]; then
            echo "$TAG is ready as a draft: $(gh release view "$TAG" --json url --jq .url)"
            exit 0
          fi
          # releases/latest, which frameplayerx-install and the Desktop Mode
          # launcher read (and stable FramePlayerX when GitHub's release
          # list can't be read), must never point at a beta.
          latest=true
          if [ "$PRERELEASE" = true ]; then
            latest=false
          fi
          gh release edit "$TAG" --draft=false --latest="$latest"
