name: pages

# Publishes site/ to GitHub Pages: the page the README's Frame Control button
# opens (GitHub doesn't keep links that open apps; a web page can). Once:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/logo.svg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir _site
          cp site/* assets/logo.svg _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
