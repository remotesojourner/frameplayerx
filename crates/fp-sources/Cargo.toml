[package]
name = "fp-sources"
version = "0.1.0"
description = "FramePlayerX media sources: local folders, HTTP(S), WebDAV, DLNA/UPnP, DeoVR/HereSphere feeds, SMB2/3 and NFSv3, with random-access ByteSources for the demuxer"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["smb", "sftp", "nfs"]
# Pure-Rust SMB2/3 client (smb2, on a tokio runtime of its own).
smb = ["dep:smb2", "dep:tokio"]
# Pure-Rust SSH and SFTP (russh with ring, on a tokio runtime of its own).
sftp = ["dep:russh", "dep:russh-sftp", "dep:tokio"]
# Pure-Rust NFSv3 client (nfs3_client, on a tokio runtime of its own).
nfs = ["dep:nfs3_client", "dep:tokio", "dep:libc"]

[dependencies]
fp-core.workspace = true
base64.workspace = true
log.workspace = true
percent-encoding = "2.3"
quick-xml = "0.42"
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { workspace = true, features = ["rustls"] }
url = "2.5"

libc = { workspace = true, optional = true }
nfs3_client = { version = "0.9.1", features = ["tokio"], optional = true }
smb2 = { version = "0.36.0", optional = true }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"], optional = true }
russh-sftp = { version = "3.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], optional = true }

[dev-dependencies]
# An in-memory NFSv3 server for the NFS source's tests.
nfs3_server = { version = "0.11.1", features = ["memfs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile.workspace = true
tiny_http.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
